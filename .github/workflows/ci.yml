name: Dynamic Build, Optimize and Publish

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # каждые 4 часа для проверки апстрим-релизов в PyPI
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      service:
        description: 'сервис для сборки (all / Base / Camoufox / ClearcoteBrowser / CloakBrowser)'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      should_build_base: ${{ steps.set-matrix.outputs.should_build_base }}
    steps:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python for detection
      # https://github.com/actions/setup-python/releases/tag/v7.0.0
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install detection dependencies
        run: pip install httpx

      - name: Detect services to build
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python3 scripts/detect_service_to_build.py

  build-base:
    needs: setup-matrix
    if: ${{ needs.setup-matrix.outputs.should_build_base == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Base (Fat only)
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BASE_TAG="${{ env.REGISTRY }}/${REPO_LOWER}/base:latest"
          echo "🏷️ сборка и пуш базового образа: $BASE_TAG"
          docker buildx build --push -t "$BASE_TAG" ./Base

  build-and-push:
    needs: [setup-matrix, build-base]
    # Всегда запускается, если матрица не пуста (даже если build-base был skipped)
    if: |
      always() &&
      needs.setup-matrix.outputs.matrix != '[]' && needs.setup-matrix.outputs.matrix != '' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Изолированная блокировка параллельных сборок одного и того же сервиса
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.service }}
      cancel-in-progress: false
    # ВАЖНО: Dockerfile каждого сервиса должен использовать CMD, а не ENTRYPOINT -
    # шаги "Sync Playwright Version" и "Extract Internal Browser Version" полагаются
    # на то, что `docker run image <команда>` ЗАМЕНЯЕТ команду контейнера, а не
    # дописывается к ней. С ENTRYPOINT это приводит к тихому зависанию джобы
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip httpx
          SERVICE_DIR="./${{ matrix.service }}"

          if [ -f "$SERVICE_DIR/requirements-test.txt" ]; then
            echo "ℹ️ найден $SERVICE_DIR/requirements-test.txt, устанавливаем зависимости..."
            pip install -r "$SERVICE_DIR/requirements-test.txt"
          elif [ -f "$SERVICE_DIR/requirements.txt" ]; then
            echo "ℹ️ найден $SERVICE_DIR/requirements.txt, устанавливаем зависимости..."
            pip install -r "$SERVICE_DIR/requirements.txt"
          else
            echo "⚠️ файл зависимостей в $SERVICE_DIR не найден, используются базовые библиотеки."
          fi

      # системные (apt) зависимости, нужные ТОЛЬКО тесту (запускается на раннере
      # через slim build --host-exec, т.е. вне контейнера) — например ffmpeg
      # для генерации тестовых видео/аудио. В финальный образ не попадают.
      - name: Install Linux Test Dependencies
        run: |
          SERVICE_DIR="./${{ matrix.service }}"
          DEPS_FILE="$SERVICE_DIR/linux_deps.txt"

          if [ -f "$DEPS_FILE" ]; then
            echo "ℹ️ найден $DEPS_FILE, читаем список пакетов..."
            PACKAGES=$(grep -vE '^\s*(#|$)' "$DEPS_FILE" | tr '\n' ' ' | xargs)
            if [ -n "$PACKAGES" ]; then
              echo "устанавливаем на раннер: $PACKAGES"
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends $PACKAGES
            else
              echo "⚠️ файл найден, но пуст (только комментарии) — пропускаем."
            fi
          else
            echo "ℹ️ $DEPS_FILE не найден, системные зависимости для теста не устанавливаются."
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Lowercase Names & Version Tags
        id: names
        run: |
          SERVICE_LOWER=$(echo "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE=$(echo "${{ env.REGISTRY }}/${{ github.repository }}/${SERVICE_LOWER}" | tr '[:upper:]' '[:lower:]')
          echo "service_lower=${SERVICE_LOWER}" >> $GITHUB_OUTPUT
          echo "tag_latest=${IMAGE_BASE}:latest" >> $GITHUB_OUTPUT

      # Сборка Fat-образа браузера (тянет уже готовый Base из GHCR)
      - name: Build Fat Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: ${{ steps.names.outputs.service_lower }}:orig

      # Синхронизация версии playwright на раннере с той, что реально запечена в образе.
      # Playwright-server (Camoufox) жёстко проверяет совпадение версий клиент/сервер: расхождение = "428 Precondition Required".
      - name: Sync Playwright Version With Image
        run: |
          IMAGE_PW_VERSION=$(cat scripts/sync_playwright.py | docker run -i --rm "${{ steps.names.outputs.service_lower }}:orig" python - 2>/dev/null || true)
          echo "ℹ️ результат детекции версии из образа: '$IMAGE_PW_VERSION'"
          if [ -n "$IMAGE_PW_VERSION" ]; then
            # major.minor (например: 1.60.0 -> 1.60 или "playwright<1.61,>=1.60" -> 1.60)
            PW_MAJOR_MINOR=$(echo "$IMAGE_PW_VERSION" | grep -oE '[0-9]+\.[0-9]+' | head -n1)
            CURRENT_PW_VERSION=$(python3 -c "import playwright; print(playwright.__version__)" 2>/dev/null || true)
            echo "ℹ️ целевая версия Playwright: $PW_MAJOR_MINOR (текущая на раннере: $CURRENT_PW_VERSION)"
            if [[ "$CURRENT_PW_VERSION" != "$PW_MAJOR_MINOR"* ]]; then
              echo "⚠️ версии различаются: переустановка Playwright на раннере..."
              pip install "playwright~=${PW_MAJOR_MINOR}.0"
            else
              echo "ℹ️ версии Playwright совпадают."
            fi
          else
            echo "ℹ️ специфичная версия Playwright не обнаружена, используется установленная по умолчанию."
          fi

      # установка SlimToolkit
      - name: Install SlimToolkit
        run: |
          curl -sL "https://github.com/slimtoolkit/slim/releases/latest/download/dist_linux.tar.gz" -o /tmp/ds.tar.gz
          tar -xvf /tmp/ds.tar.gz -C /tmp
          sudo cp -a /tmp/dist_linux/* /usr/local/bin/
          sudo ln -sf /usr/local/bin/docker-slim /usr/local/bin/slim 2>/dev/null || true
          slim --version

      # оптимизация через Slim (выбирает probe.py, если есть, иначе test.py)
      - name: Optimize Docker Image
        run: |
            PROBE_SCRIPT=""
            if [ -f "./${{ matrix.service }}/probe.py" ]; then
              PROBE_SCRIPT="./${{ matrix.service }}/probe.py"
            elif [ -f "./${{ matrix.service }}/test.py" ]; then
              PROBE_SCRIPT="./${{ matrix.service }}/test.py"
            fi
            
            SERVICE_PORT=$(docker inspect "${{ steps.names.outputs.service_lower }}:orig" --format '{{json .Config.ExposedPorts}}' | python3 scripts/extract_port.py)
            echo "ℹ️ определён порт сервиса: $SERVICE_PORT"
          
            SLIM_EXTRA_FLAGS=""
            PRESERVE_FILE="./${{ matrix.service }}/preserve_paths.txt"
            if [ -f "$PRESERVE_FILE" ]; then
              while IFS= read -r p || [ -n "$p" ]; do
                path=$(echo "$p" | xargs)
                case "$path" in ''|'#'*) continue ;; esac
                if docker run --rm "${{ steps.names.outputs.service_lower }}:orig" test -e "$path"; then
                  SLIM_EXTRA_FLAGS="$SLIM_EXTRA_FLAGS --preserve-path $path"
                fi
              done < "$PRESERVE_FILE"
            fi
            
            if [ -n "$PROBE_SCRIPT" ]; then
              DIV=$'\n==========================================\n'
              echo -e "${DIV}🛠 Slim Probe с использованием: ${PROBE_SCRIPT}${DIV}"
              slim build \
                --target ${{ steps.names.outputs.service_lower }}:orig \
                --tag ${{ steps.names.outputs.tag_latest }} \
                --expose "$SERVICE_PORT" \
                --publish-port "$SERVICE_PORT:$SERVICE_PORT" \
                --http-probe-off \
                --show-clogs \
                $SLIM_EXTRA_FLAGS \
                --host-exec "python3 -u $PROBE_SCRIPT"
            else
              slim build \
                --target ${{ steps.names.outputs.service_lower }}:orig \
                --tag ${{ steps.names.outputs.tag_latest }} \
                --expose "$SERVICE_PORT" \
                --publish-port "$SERVICE_PORT:$SERVICE_PORT" \
                --show-clogs \
                $SLIM_EXTRA_FLAGS \
                --http-probe-ports "$SERVICE_PORT"
            fi

      # запуск оптимизированного контейнера БЕЗ SlimToolkit и прогон полного test.py
      - name: Verify Minified Image (Pure Docker Run)
        run: |
          TEST_SCRIPT="./${{ matrix.service }}/test.py"
          if [ ! -f "$TEST_SCRIPT" ]; then
            echo "⚠️ test.py не найден, шаг верификации пропускается."
            exit 0
          fi

          SERVICE_PORT=$(docker inspect "${{ steps.names.outputs.service_lower }}:orig" --format '{{json .Config.ExposedPorts}}' | python3 scripts/extract_port.py)

          EXTRA_RUN_FLAGS=""
          FLAGS_FILE="./${{ matrix.service }}/docker_run_flags.txt"
          if [ -f "$FLAGS_FILE" ]; then
            EXTRA_RUN_FLAGS=$(grep -vE '^\s*(#|$)' "$FLAGS_FILE" | tr '\n' ' ' | xargs)
            echo "ℹ️ доп. флаги docker run для ${{ matrix.service }}: $EXTRA_RUN_FLAGS"
          fi

          CONTAINER_ID=$(docker run -d $EXTRA_RUN_FLAGS -p "$SERVICE_PORT:$SERVICE_PORT" ${{ steps.names.outputs.tag_latest }})
          
          cleanup() {
            DIV=$"\n==========================================\n"
            echo -e "${DIV}ℹ️ остановка проверочного контейнера..."
            echo "=== EXIT/OOM STATUS ==="
            docker inspect "$CONTAINER_ID" --format='ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}} FinishedAt={{.State.FinishedAt}}' || true
            echo "=== ПОЛНЫЕ ЛОГИ КОНТЕЙНЕРА (stdout/stderr) ==="
            docker logs "$CONTAINER_ID" || true
            docker rm -f "$CONTAINER_ID" || true
            echo -e "${DIV}"
          }
          trap cleanup EXIT

          echo "ℹ️ запуск полного интеграционного теста ($TEST_SCRIPT)..."
          python3 -u "$TEST_SCRIPT"
          echo "✅ ВЕРИФИКАЦИЯ ПРОЙДЕНА УСПЕШНО"

      - name: Extract Internal Browser Version & Push Tags
        run: |
          # извлечение версии библиотеки из готового сжатого контейнера
          PKG_NAME=""
          PKG_FILE="./${{ matrix.service }}/pypi_package.txt"
          if [ -f "$PKG_FILE" ]; then
            PKG_NAME=$(xargs < "$PKG_FILE")
          fi
          
          INSTALLED_VER=""
          if [ -n "$PKG_NAME" ]; then
            echo "ℹ️ извлечение версии '$PKG_NAME' из fat-образа (${{ steps.names.outputs.service_lower }}:orig)..."
            INSTALLED_VER=$(docker run -i --rm "${{ steps.names.outputs.service_lower }}:orig" python - "$PKG_NAME" < scripts/pkg_version.py 2>/dev/null | tr -d '\r\n' || true)
          fi

          echo "ℹ️ полученная версия пакета: '$INSTALLED_VER'"
          IMAGE_BASE=$(echo "${{ env.REGISTRY }}/${{ github.repository }}/${{ steps.names.outputs.service_lower }}" | tr '[:upper:]' '[:lower:]')

          # в :latest
          docker push ${{ steps.names.outputs.tag_latest }}

          # в версионный тег
          if [ -n "$INSTALLED_VER" ]; then
            echo "🏷️ присвоен версионный тег: $IMAGE_BASE:$INSTALLED_VER"
            docker tag ${{ steps.names.outputs.tag_latest }} "$IMAGE_BASE:$INSTALLED_VER"
            docker push "$IMAGE_BASE:$INSTALLED_VER"
          else
            echo "⚠️ версия пакета не была определена, версионный тег не запушен."
          fi