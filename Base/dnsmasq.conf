user=root
no-resolv
no-poll

# Слушать локально
listen-address=127.0.0.1
bind-interfaces
port=53

# Быстрый upstream DNS
server=1.1.1.1
server=1.0.0.1
server=8.8.8.8

cache-size=10000

# Блокировка DoH (заставляет Chromium и Gecko сразу упасть на локальный DNS-резолвер)
address=/use-application-dns.net/
address=/dns.google/
address=/dns.google.com/
address=/chrome.cloudflare-dns.com/
address=/mozilla.cloudflare-dns.com/

conf-dir=/etc/dnsmasq.d/,*.conf

