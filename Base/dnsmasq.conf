user=root
no-hosts
no-resolv
no-poll

listen-address=127.0.0.1
bind-interfaces
port=53

server=1.1.1.1
server=1.0.0.1
server=8.8.8.8

cache-size=10000

# Блокировка DoH Bootstrap & Canary
address=/use-application-dns.net/0.0.0.0
address=/dns.google/0.0.0.0
address=/dns.google.com/0.0.0.0
address=/chrome.cloudflare-dns.com/0.0.0.0
address=/mozilla.cloudflare-dns.com/0.0.0.0

conf-dir=/etc/dnsmasq.d/,*.conf

