user=root
no-resolv
no-poll

# Слушать локально
listen-address=127.0.0.1
bind-interfaces
port=53

# Быстрый upstream DNS
server=1.1.1.1
server=1.0.0.1
server=8.8.8.8

# Быстрый размер кэша
cache-size=10000

# addn-hosts и no-hosts удалены, чтобы localhost нормально вычислялся для CDP
conf-dir=/etc/dnsmasq.d/,*.conf
