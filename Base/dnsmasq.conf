user=root
no-resolv
no-poll
listen-address=127.0.0.1
port=53
cache-size=10000

# Жесткие апстримы, минуя петли
server=1.1.1.1
server=8.8.8.8

# Отстрел DoH канареек для принудительного отключения обхода DNS в Chromium/Gecko
address=/use-application-dns.net/
address=/dns.google/
address=/dns.google.com/
address=/chrome.cloudflare-dns.com/
address=/mozilla.cloudflare-dns.com/

conf-dir=/etc/dnsmasq.d/,*.conf
